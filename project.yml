name: diznfo
options:
  bundleIdPrefix: com.idleberg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing so a local build registers with QuickLook without an
    # Apple Developer team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  NFOKit:
    path: .

targets:
  Diznfo:
    type: application
    platform: macOS
    sources:
      - App
      # The same files the extension embeds as data: URIs — the app needs them
      # as real fonts. A folder reference so they land in Resources/Fonts,
      # which is what ATSApplicationFontsPath points at below.
      - path: Extension/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_NAME: Diznfo
      PRODUCT_BUNDLE_IDENTIFIER: com.idleberg.Diznfo
    dependencies:
      - package: NFOKit
      - target: DiznfoExtension
        embed: true
        codeSign: true
    # Deliberately not sandboxed: the app has to write into the extension's
    # container to hand it the user's settings. See DEVELOP "Sharing settings".
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Diznfo
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        # Registers the bundled Px437 families at launch, so NSFont can find
        # them by family name without a CTFontManager call.
        ATSApplicationFontsPath: Fonts
        CFBundleDocumentTypes:
          - CFBundleTypeName: NFO Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.idleberg.Diznfo.nfo
              - com.idleberg.Diznfo.diz
          # Read-only: the art is cursor moves and color codes, not text.
          - CFBundleTypeName: ANSI Art
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.idleberg.Diznfo.ans
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.idleberg.Diznfo.nfo
            UTTypeDescription: NFO Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [nfo]
          - UTTypeIdentifier: com.idleberg.Diznfo.diz
            UTTypeDescription: Description in Zip
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [diz]
          # Not plain text — escape codes would show up as garbage in an editor.
          - UTTypeIdentifier: com.idleberg.Diznfo.ans
            UTTypeDescription: ANSI Art
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ans]

  DiznfoExtension:
    type: app-extension
    platform: macOS
    sources: [Extension]
    settings:
      # macOS rejects an app extension whose bundle id is not prefixed by its
      # containing app's — it silently never registers with QuickLook.
      PRODUCT_BUNDLE_IDENTIFIER: com.idleberg.Diznfo.DiznfoExtension
    dependencies:
      - package: NFOKit
      - sdk: QuickLookUI.framework
      - sdk: WebKit.framework
    entitlements:
      path: Extension/DiznfoExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # WKWebView's content process refuses to launch in a sandbox without
        # this, even for a page that loads nothing off the network. JavaScript
        # is disabled and the HTML is fully inlined, so nothing is fetched.
        com.apple.security.network.client: true
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Diznfo Preview
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: 
              [com.idleberg.Diznfo.nfo, com.idleberg.Diznfo.diz, com.idleberg.Diznfo.ans]
            QLSupportsSearchableItems: false
