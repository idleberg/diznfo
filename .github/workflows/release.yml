name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Gitignored locally; project.yml references it as the config file for
      # both configurations, so it has to exist before xcodegen runs.
      - name: Create Local.xcconfig
        run: touch Local.xcconfig

      - name: Generate project
        run: mise run generate

      - name: Build Release (${{ matrix.arch }})
        run: |
          xcodebuild \
            -project quicklook-nfo.xcodeproj \
            -scheme QuicklookNFO \
            -configuration Release \
            -derivedDataPath build \
            -arch ${{ matrix.arch }} \
            ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_SWIFT_SYMBOLS=YES \
            DEAD_CODE_STRIPPING=YES \
            build

      - name: Package app
        run: |
          cd "build/Build/Products/Release"
          zip -r -9 quicklook-nfo.zip "Quicklook NFO.app"
          mv quicklook-nfo.zip "$GITHUB_WORKSPACE/quicklook-nfo-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip"

      - name: Generate checksums
        run: sha256sum quicklook-nfo-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip > SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quicklook-nfo-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            SHA256SUMS
          generate_release_notes: ${{ matrix.arch == 'arm64' }}
